name: Tag release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls \
            --jq '.[0].labels[].name' || true)
          if grep -qx skip-release <<< "$labels"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list 'v2.*' --sort=-v:refname | head -n1)
          latest=${latest:-v2.0.0}
          IFS=. read -r maj min pat <<< "${latest#v}"
          if grep -qx minor <<< "$labels"; then min=$((min+1)); pat=0
          else pat=$((pat+1)); fi
          echo "tag=v$maj.$min.$pat" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            --target "${{ github.sha }}" --generate-notes
